<!doctype html><html lang="cs"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ELYRA</title><style>body{margin:0;background:#130d22;color:#fff;font:16px system-ui}header{padding:16px;background:#251439}#scene{height:52vh;display:flex;align-items:center;justify-content:center}svg{height:95%;width:90%;touch-action:none}nav{display:flex;gap:8px;padding:8px;overflow-x:auto}button{background:#7443a7;color:white;border:0;border-radius:20px;padding:12px}#log{height:21vh;overflow:auto;padding:10px;background:#221431}p{margin:6px;padding:8px;background:#43285d;border-radius:10px}footer{display:flex;padding:8px;gap:8px}input{flex:1;min-width:0;background:#342246;border:1px solid #79549c;border-radius:20px;padding:12px;color:white}</style><header>♥ ELYRA AI · 3D demo</header><div id="scene"><svg viewBox="0 0 300 400" aria-label="Stylizovaná virtuální postava" id="avatar"><defs><linearGradient id="dress"><stop stop-color="#a76ed7"/><stop offset="1" stop-color="#4b216d"/></linearGradient></defs><g id="person"><ellipse cx="150" cy="380" rx="65" ry="10" fill="#382447"/><path d="M123 284 L120 367 L145 367 L155 284 M155 284 L158 367 L183 367 L177 284" fill="#332640"/><path d="M118 180 L96 280 L206 280 L181 180Z" fill="url(#dress)"/><path d="M120 185 L96 243 M181 185 L205 243" stroke="#f0b6a0" stroke-width="19" stroke-linecap="round"/><path d="M112 93 Q105 42 150 40 Q195 42 189 93 L199 166 L102 166Z" fill="#31213c"/><ellipse cx="150" cy="115" rx="37" ry="49" fill="#f1b9a7"/><ellipse cx="136" cy="111" rx="4" ry="5" fill="#2b2037"/><ellipse cx="165" cy="111" rx="4" ry="5" fill="#2b2037"/><path d="M141 136 Q151 144 162 136" fill="none" stroke="#9b5969" stroke-width="3"/><path d="M111 96 Q125 40 169 66 Q185 82 190 96" fill="none" stroke="#31213c" stroke-width="19"/></g></svg></div><nav><button onclick="pose('wave')">👋 Zamávat</button><button onclick="pose('dance')">💃 Tančit</button><button onclick="pose('hug')">♥ Objetí</button><button onclick="pose('kiss')">💋 Polibek</button><button onclick="dress()">👗 Oblečení</button><button onclick="clearChat()">Smazat chat</button></nav><div id="log"></div><footer><input id="input" placeholder="Napiš Elyře…"><button onclick="send()">➤</button></footer><script>
const p=document.getElementById('person'),log=document.getElementById('log'),input=document.getElementById('input');let messages=[];try{messages=JSON.parse(localStorage.getItem('elyra_chat')||'[]')}catch(e){}function line(w,t){const x=document.createElement('p');x.textContent=w+': '+t;log.append(x);log.scrollTop=log.scrollHeight}messages.forEach(m=>line(m[0],m[1]));if(!messages.length)line('Elyra','Ahoj! ♥ Jak se dnes máš?');function pose(k){p.animate(k==='dance'?[{transform:'rotate(-8deg)'},{transform:'rotate(8deg)'},{transform:'rotate(0deg)'}]:[{transform:'translateY(0)'},{transform:'translateY(-12px) scale(1.04)'},{transform:'translateY(0)'}],{duration:900,iterations:k==='dance'?3:1})}let c=0;function dress(){const colors=['#a76ed7','#e45384','#4fc0b3','#d5a44f'];c=(c+1)%colors.length;document.querySelector('#dress stop').setAttribute('stop-color',colors[c])}function send(){let t=input.value.trim();if(!t)return;input.value='';const a=['To mě zajímá, povíš mi víc? ♥','Ráda tě poslouchám. 😊','Co bys chtěl dnes společně podniknout?','Můžeme si povídat nebo zatancovat. ♥'];for(const m of [['Ty',t],['Elyra',a[Math.floor(Math.random()*a.length)]]]){messages.push(m);line(...m)}messages=messages.slice(-100);localStorage.setItem('elyra_chat',JSON.stringify(messages))}function clearChat(){if(confirm('Smazat historii?')){messages=[];localStorage.removeItem('elyra_chat');log.replaceChildren()}}input.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script></html>
