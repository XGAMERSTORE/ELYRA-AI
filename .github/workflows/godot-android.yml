name: Godot Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'godot/**'
      - '.github/workflows/godot-android.yml'
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Godot 4.3 and Android templates
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q Godot_v4.3-stable_export_templates.tpz
          cp templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
      - name: Create Android debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Configure Godot editor Android paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Import and validate Godot
        run: |
          ./Godot_v4.3-stable_linux.x86_64 --headless --path godot --editor --quit
          ./Godot_v4.3-stable_linux.x86_64 --headless --path godot --quit-after 2
      - name: Build APK
        run: |
          mkdir -p godot/build
          ./Godot_v4.3-stable_linux.x86_64 --headless --path godot --export-debug "Android" build/ELYRA-AI-debug.apk
          test -s godot/build/ELYRA-AI-debug.apk
      - name: Show APK metadata
        if: success()
        run: |
          ls -lh godot/build/ELYRA-AI-debug.apk
          sha256sum godot/build/ELYRA-AI-debug.apk | tee godot/build/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ELYRA-AI-Godot-Android-APK
          path: |
            godot/build/ELYRA-AI-debug.apk
            godot/build/SHA256SUMS.txt
          if-no-files-found: warn
